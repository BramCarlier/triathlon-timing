name: Dependency security

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: composer audit --locked --no-interaction
      - run: yarn install --immutable --mode=skip-builds
      - run: yarn npm audit --all --recursive
